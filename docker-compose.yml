version: '3.9'

services:

  app:
    build: .
    container_name: ummami_app
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: ummami_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ummami
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: