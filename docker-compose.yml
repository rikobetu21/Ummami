version: '3.9'

services:

  app:
    build: .
    container_name: ummami_app
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - mysql
      - redis
      - minio

  mysql:
    image: mysql:8.4
    container_name: ummami_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ummami
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: ummami_redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: ummami_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data: